<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
#pdfEditorTitle { z-index: 1030; }
#pdfEditorApp > section, #pageListScrollArea, #pageDetailsScrollArea { min-height: 0; }

</style>
</head>
<body class="d-flex flex-column vh-100 overflow-hidden">
<header id="pdfEditorTitle" class="bg-body border-bottom flex-shrink-0">
  <nav class="navbar bg-body-tertiary border-bottom shadow-sm py-2" aria-label="PDF Editor navigation">
    <div class="container-fluid d-flex flex-wrap align-items-center gap-2">
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn btn-outline-secondary" data-bs-toggle="offcanvas" data-bs-target="#appNavigation" aria-controls="appNavigation" aria-label="Navigate to another app" data-i18n-aria="navigate" title="Navigate to another app" data-i18n-title="navigate"><i class="bi bi-grid"></i></button>
        <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="/" aria-label="PDF Editor home"><i class="bi bi-file-earmark-pdf fs-3 text-danger"></i><span class="h3 mb-0">PDF Editor</span></a>
      </div>

    </div>
  </nav>
</header>
<div class="offcanvas offcanvas-top" tabindex="-1" id="appNavigation" aria-label="Application navigation">
  <div class="offcanvas-body d-flex flex-wrap align-items-center gap-2 p-3">
    <nav class="nav nav-pills flex-row flex-wrap gap-2" aria-label="Applications">
      <a class="nav-link d-flex align-items-center gap-2" href="/"><i class="bi bi-house"></i><span data-i18n="home">Home</span></a>
      <a class="nav-link d-flex align-items-center gap-2 active" href="/pdf-editor" aria-current="page"><i class="bi bi-file-earmark-pdf"></i><span>PDF Editor</span></a>
      <a class="nav-link d-flex align-items-center gap-2" href="/image-editor"><i class="bi bi-image"></i><span data-i18n="imageEditor">Image Editor</span></a>
    </nav>
    <div class="d-flex flex-wrap align-items-center gap-2 ms-auto">
        <div class="dropdown">
          <button id="languageButton" type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Choose language"><i class="bi bi-translate me-sm-1"></i><span id="languageLabel" class="d-none d-sm-inline">English</span></button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageButton">
            <li><button type="button" class="dropdown-item active" data-language-choice="en" aria-pressed="true">English</button></li>
            <li><button type="button" class="dropdown-item" data-language-choice="zh-CN" aria-pressed="false">简体中文</button></li>
            <li><button type="button" class="dropdown-item" data-language-choice="vi" aria-pressed="false">Tiếng Việt</button></li>
          </ul>
        </div>
        <div class="dropdown">
          <button id="themeButton" type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Choose theme" data-i18n-aria="chooseTheme"><i class="bi bi-circle-half me-sm-1"></i><span class="d-none d-sm-inline" data-i18n="theme">Theme</span></button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="themeButton">
            <li><button type="button" class="dropdown-item" data-theme-choice="light"><i class="bi bi-sun me-2"></i><span data-i18n="light">Light</span></button></li>
            <li><button type="button" class="dropdown-item" data-theme-choice="dark"><i class="bi bi-moon-stars me-2"></i><span data-i18n="dark">Dark</span></button></li>
            <li><button type="button" class="dropdown-item active" data-theme-choice="auto"><i class="bi bi-circle-half me-2"></i><span data-i18n="auto">Auto</span></button></li>
          </ul>
        </div>

    </div>
  </div>
</div>

<main id="pdfEditorApp" class="container-fluid flex-grow-1 d-flex flex-column overflow-hidden">
  <section id="pageListSection" class="d-flex flex-column flex-grow-1 overflow-hidden">
    <div id="pageListToolbar" class="bg-body border-bottom py-3 flex-shrink-0">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-lg"><div class="d-flex flex-wrap gap-2">
          <button id="addPdf" type="button" class="btn btn-primary"><i class="bi bi-file-earmark-plus me-1"></i><span data-i18n="addPdf">Add PDF</span></button>
          <button id="addBlank" type="button" class="btn btn-primary"><i class="bi bi-file-earmark me-1"></i><span data-i18n="blankPage">Blank Page</span></button>
          <button id="exportPdf" type="button" class="btn btn-success" disabled><i class="bi bi-download me-1"></i><span data-i18n="exportPdf">Export PDF</span></button>
          <button id="clearAll" type="button" class="btn btn-danger" disabled><i class="bi bi-trash3 me-1"></i><span data-i18n="clearAll">Clear All</span></button>
        </div></div>

        <div class="col-12 col-lg-auto"><div class="d-flex justify-content-lg-end"><div class="dropdown">
          <button id="columnsButton" type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-grid-3x3-gap me-1"></i>Columns: 6</button>
          <ul id="columnsMenu" class="dropdown-menu dropdown-menu-end" aria-labelledby="columnsButton"><li><button type="button" class="dropdown-item" data-columns="2">2 Columns</button></li><li><button type="button" class="dropdown-item" data-columns="3">3 Columns</button></li><li><button type="button" class="dropdown-item" data-columns="4">4 Columns</button></li><li><button type="button" class="dropdown-item" data-columns="5">5 Columns</button></li><li><button type="button" class="dropdown-item active" data-columns="6">6 Columns</button></li>
          </ul>
        </div></div></div>
      </div>
      <div class="row g-2 align-items-center mt-1">
        <div class="col-12 col-lg"><div class="d-flex flex-wrap gap-2">
          <button id="clearSelection" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-x-circle me-1"></i>Clear Selection (0)</button>
          <button id="deleteSelected" type="button" class="btn btn-outline-danger" disabled><i class="bi bi-trash me-1"></i><span data-i18n="delete">Delete</span></button>
          <button id="rotateSelected" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-clockwise me-1"></i><span data-i18n="rotate">Rotate 90°</span></button>
          <button id="moveUp" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-up me-1"></i><span data-i18n="moveUp">Move Up</span></button>
          <button id="moveDown" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-down me-1"></i><span data-i18n="moveDown">Move Down</span></button>
        </div></div>

        <div class="col-12 col-lg-auto"><div class="d-flex flex-wrap justify-content-lg-end gap-2">
          <button id="undoBtn" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-counterclockwise me-1"></i><span data-i18n="undo">Undo</span></button>
        </div></div>
      </div>
    </div>
    <div id="pageListScrollArea" class="py-3 flex-grow-1 overflow-y-auto overflow-x-hidden">
    <div>
    <div id="emptyState" class="rounded p-5 text-center text-secondary border border-2 border-secondary-subtle"><span data-i18n="emptyState">No pages yet. Add a PDF or create a blank page.</span></div>
    <div id="pages" class="row row-cols-2 row-cols-sm-3 row-cols-lg-6 g-3" aria-label="PDF pages" data-i18n-aria="pdfPages"></div>
    </div>
    </div>
  </section>
  <section id="pageDetailsSection" class="d-none d-flex flex-column flex-grow-1 overflow-hidden">
    <div id="pageDetailsToolbar" class="bg-body border-bottom py-3 flex-shrink-0">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-lg"><div class="d-flex flex-wrap gap-2 align-items-center">
          <button id="back" type="button" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i><span data-i18n="back">Back to Pages</span></button>
        </div></div>

        <div class="col-12 col-lg-auto"><div class="d-flex flex-wrap justify-content-lg-end gap-2 align-items-center">
          <span id="pagePosition" class="small text-secondary" aria-live="polite">Page 1 / 1</span>
          <button id="previous" type="button" class="btn btn-primary" aria-label="Previous page" data-i18n-aria="previous"><i class="bi bi-chevron-left"></i></button>
          <button id="next" type="button" class="btn btn-primary" aria-label="Next page" data-i18n-aria="next"><i class="bi bi-chevron-right"></i></button>
          <div class="dropdown">
            <button id="detailsZoomButton" type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">Zoom: 100%</button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="detailsZoomButton" class="overflow-auto">
              <li><button type="button" class="dropdown-item" data-zoom-value="200">200%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="175">175%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="150">150%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="125">125%</button></li>
              <li><button type="button" class="dropdown-item active" data-zoom-value="100">100%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="75">75%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="50">50%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="25">25%</button></li>
            </ul>
            <select id="detailsZoom" class="d-none" aria-label="Page zoom" tabindex="-1">
              <option value="fit">Fit</option><option value="200">200%</option><option value="175">175%</option><option value="150">150%</option><option value="125">125%</option><option value="100" selected>100%</option><option value="75">75%</option><option value="50">50%</option><option value="25">25%</option>
            </select>
          </div>
        </div></div>
      </div>
      <div id="pageDetailsDrawingTools" class="row g-2 align-items-center mt-1">
        <div class="col-12 col-lg"><div class="d-flex flex-wrap gap-2">
          <button id="toolHold" type="button" class="btn btn-primary" aria-pressed="true" title="Hold and drag to move the page" data-i18n-title="holdHint"><i class="bi bi-hand-index-thumb me-1"></i><span data-i18n="hold">Hold</span></button>
          <button id="toolSelectText" type="button" class="btn btn-outline-primary" data-demo-tool="SelectText" title="Select and copy recognized PDF text" data-i18n-title="selectTextHint"><i class="bi bi-cursor-text me-1"></i><span data-i18n="selectText">Select Text</span></button>
          <button id="toolPageSize" type="button" class="btn btn-outline-primary" data-demo-tool="PageSize"><i class="bi bi-aspect-ratio me-1"></i><span data-i18n="pageSize">Page Size</span></button>
          <button id="toolHighlight" type="button" class="btn btn-outline-primary" data-demo-tool="Highlight"><i class="bi bi-highlighter me-1"></i><span data-i18n="highlight">Highlight</span></button>
          <button id="toolAddText" type="button" class="btn btn-outline-primary" data-demo-tool="Text"><i class="bi bi-fonts me-1"></i><span data-i18n="text">Text</span></button>
          <button id="toolImage" type="button" class="btn btn-outline-primary" data-demo-tool="Image"><i class="bi bi-image me-1"></i><span data-i18n="image">Image</span></button>
          <button id="toolRectangle" type="button" class="btn btn-outline-primary" data-demo-tool="Rectangle"><i class="bi bi-square me-1"></i><span data-i18n="rectangle">Rectangle</span></button>
          <button id="toolEllipse" type="button" class="btn btn-outline-primary" data-demo-tool="Ellipse"><i class="bi bi-circle me-1"></i><span data-i18n="ellipse">Ellipse</span></button>
          <button id="toolDrawLine" type="button" class="btn btn-outline-primary" data-demo-tool="Line"><i class="bi bi-slash-lg me-1"></i><span data-i18n="line">Line</span></button>
          <button id="toolDraw" type="button" class="btn btn-outline-primary" data-demo-tool="Draw"><i class="bi bi-pencil me-1"></i><span data-i18n="draw">Draw</span></button>
        </div></div>
        <div class="col-12 col-lg-auto"><div class="d-flex flex-wrap justify-content-lg-end gap-2">
          <button id="undoBtnDetails" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-counterclockwise me-1"></i><span data-i18n="undo">Undo</span></button>
        </div></div>
      </div>
      <div id="pageDetailsToolOptions" class="row g-2 align-items-center mt-1 d-none" aria-live="polite">
        <div id="pageDetailsToolOptionsContent" class="col-12 col-lg"><div id="pageDetailsToolOptionsFields" class="d-flex flex-wrap align-items-center gap-3"></div></div>
        <div id="pageDetailsDeleteColumn" class="col-12 col-lg-auto"><div class="d-flex flex-wrap justify-content-lg-end gap-2"><button id="deleteDetailsHighlight" type="button" class="btn btn-outline-danger d-none" disabled title="Delete selected Highlight object" aria-label="Delete selected Highlight object" data-delete-tool="Highlight"><i class="bi bi-trash"></i></button><button id="deleteDetailsText" type="button" class="btn btn-outline-danger d-none" disabled title="Delete selected Text object" aria-label="Delete selected Text object" data-delete-tool="Text"><i class="bi bi-trash"></i></button><button id="deleteDetailsImage" type="button" class="btn btn-outline-danger d-none" disabled title="Delete selected Image object" aria-label="Delete selected Image object" data-delete-tool="Image"><i class="bi bi-trash"></i></button><button id="deleteDetailsLine" type="button" class="btn btn-outline-danger d-none" disabled title="Delete selected Line object" aria-label="Delete selected Line object" data-delete-tool="Line"><i class="bi bi-trash"></i></button><button id="deleteDetailsDraw" type="button" class="btn btn-outline-danger d-none" disabled title="Delete selected Draw object" aria-label="Delete selected Draw object" data-delete-tool="Draw"><i class="bi bi-trash"></i></button><button id="deleteDetailsRectangle" type="button" class="btn btn-outline-danger d-none" disabled title="Delete selected Rectangle object" aria-label="Delete selected Rectangle object" data-delete-tool="Rectangle"><i class="bi bi-trash"></i></button><button id="deleteDetailsEllipse" type="button" class="btn btn-outline-danger d-none" disabled title="Delete selected Ellipse object" aria-label="Delete selected Ellipse object" data-delete-tool="Ellipse"><i class="bi bi-trash"></i></button></div></div>
      </div>
    </div>
    <div id="pageDetailsScrollArea" class="flex-grow-1 overflow-auto">
    <div id="editorPage" class="bg-body-tertiary rounded my-3 p-3"><div id="detailsPaper" class="mx-auto bg-white shadow rounded overflow-hidden position-relative"><canvas id="detailsCanvas" class="d-block" aria-label="Selected PDF page"></canvas><div id="ocrTextLayer" class="position-absolute top-0 start-0 w-100 h-100 d-none" aria-label="Selectable recognized PDF text"></div><div id="highlightLayer" class="position-absolute top-0 start-0 w-100 h-100"></div><div id="textLayer" class="position-absolute top-0 start-0 w-100 h-100"></div><div id="imageLayer" class="position-absolute top-0 start-0 w-100 h-100"></div><div id="shapeLayer" class="position-absolute top-0 start-0 w-100 h-100"></div></div></div><textarea id="editorText" class="d-none" aria-hidden="true"></textarea>
    </div>
  </section>
</main>
<input id="fileInput" type="file" accept=".pdf,application/pdf" multiple hidden>
<div id="editorStatus" class="visually-hidden" role="status" aria-live="polite"></div>
<div id="clearAllModal" class="modal fade" tabindex="-1" aria-labelledby="clearAllModalLabel"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h2 id="clearAllModalLabel" class="modal-title fs-5"><span data-i18n="clearAllTitle">Clear All Pages?</span></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><span data-i18n="clearAllMessage">Are you sure you want to remove all pages? This action cannot be undone. Undo history will also be deleted.</span></div>
  <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><span data-i18n="cancel">Cancel</span></button><button id="confirmClearAll" type="button" class="btn btn-danger"><span data-i18n="clearAll">Clear All</span></button></div>
</div></div></div>
<div id="exportScopeModal" class="modal fade" tabindex="-1" aria-labelledby="exportScopeModalLabel"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h2 id="exportScopeModalLabel" class="modal-title fs-5"><span data-i18n="exportPdf">Export PDF</span></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">
    <div class="mb-3"><label for="exportFileName" class="form-label" data-i18n="fileName">File Name</label><input id="exportFileName" class="form-control" type="text" placeholder="File Name" data-i18n-placeholder="fileName" aria-label="File Name" data-i18n-aria="fileName" value="Untitled Document" maxlength="200"></div>
    <div id="exportScopeOptions"><p><span data-i18n="exportPrompt">Choose which pages to export.</span></p>
    <div class="form-check mb-3"><input id="exportAll" class="form-check-input" type="radio" name="exportScope" value="all" checked><label class="form-check-label" for="exportAll"><strong><span data-i18n="allPages">All Pages</span></strong><br><small id="allPageCount" class="text-secondary"></small></label></div>
    <div class="form-check"><input id="exportSelected" class="form-check-input" type="radio" name="exportScope" value="selected"><label class="form-check-label" for="exportSelected"><strong><span data-i18n="selectedPages">Selected Pages</span></strong><br><small id="selectedPageCount" class="text-secondary"></small></label></div>
    </div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><span data-i18n="cancel">Cancel</span></button><button id="confirmExport" type="button" class="btn btn-success"><i class="bi bi-download me-1"></i><span data-i18n="exportPdf">Export PDF</span></button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(() => {
  const root = document.documentElement;
  const choices = [...document.querySelectorAll('[data-theme-choice]')];
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  const valid = ['light', 'dark', 'auto'];
  let choice = 'auto';
  try {
    const stored = localStorage.getItem('pdfEditorTheme');
    if (valid.includes(stored)) choice = stored;
  } catch (_) {}
  function applyTheme() {
    root.setAttribute('data-bs-theme', choice === 'auto' ? (media.matches ? 'dark' : 'light') : choice);
    const icon = document.querySelector('#themeButton > i');
    if (icon) icon.className = 'bi ' + (choice === 'light' ? 'bi-sun' : choice === 'dark' ? 'bi-moon-stars' : 'bi-circle-half') + ' me-1';
    choices.forEach(button => {
      const selected = button.dataset.themeChoice === choice;
      button.classList.toggle('active', selected);
      button.setAttribute('aria-pressed', String(selected));
    });
  }
  choices.forEach(button => button.addEventListener('click', () => {
    choice = button.dataset.themeChoice;
    try { localStorage.setItem('pdfEditorTheme', choice); } catch (_) {}
    applyTheme();
  }));
  if (media.addEventListener) media.addEventListener('change', applyTheme);
  else if (media.addListener) media.addListener(applyTheme);
  applyTheme();
})();
</script>

<script type="module" src="./pdfeditor/index.js"></script>
</body>
</html>
