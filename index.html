<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root { --pdf-editor-header-height: 72px; }
#pdfEditorTitle { height: var(--pdf-editor-header-height); z-index: 1030; }
#pdfEditorTitle .navbar { min-height: 100%; }
#pdfEditorApp > section, #pageListScrollArea, #pageDetailsScrollArea { min-height: 0; }
@media (max-width: 575.98px) { :root { --pdf-editor-header-height: 120px; } }

</style>
</head>
<body class="d-flex flex-column vh-100 overflow-hidden">
<header id="pdfEditorTitle" class="bg-body border-bottom flex-shrink-0">
  <nav class="navbar bg-body-tertiary border-bottom shadow-sm py-2" aria-label="PDF Editor navigation">
    <div class="container-fluid d-flex flex-wrap align-items-center gap-2">
      <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
          <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Navigate to another app" title="Navigate to another app"><i class="bi bi-grid"></i></button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item fs-5 py-2 d-flex align-items-center gap-3" href="/"><i class="bi bi-house fs-4"></i><span>Home</span></a></li>
            <li><a class="dropdown-item fs-5 py-2 d-flex align-items-center gap-3" href="/image-editor"><i class="bi bi-image fs-4"></i><span>Image Editor</span></a></li>
          </ul>
        </div>
        <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="/" aria-label="PDF Editor home"><i class="bi bi-file-earmark-pdf fs-3 text-danger"></i><span class="h3 mb-0">PDF Editor</span></a>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-2 ms-auto">
        <input id="exportFileName" class="form-control form-control-sm w-auto" type="text" placeholder="File Name" aria-label="File Name" value="Untitled Document" maxlength="200">
        <div class="dropdown">
          <button id="themeButton" type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Choose theme"><i class="bi bi-circle-half me-1"></i>Theme</button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="themeButton">
            <li><button type="button" class="dropdown-item" data-theme-choice="light"><i class="bi bi-sun me-2"></i>Light</button></li>
            <li><button type="button" class="dropdown-item" data-theme-choice="dark"><i class="bi bi-moon-stars me-2"></i>Dark</button></li>
            <li><button type="button" class="dropdown-item active" data-theme-choice="auto"><i class="bi bi-circle-half me-2"></i>Auto</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
</header>
<main id="pdfEditorApp" class="container-fluid flex-grow-1 d-flex flex-column overflow-hidden">
  <section id="pageListSection" class="d-flex flex-column flex-grow-1 overflow-hidden">
    <div id="pageListToolbar" class="bg-body border-bottom py-3 flex-shrink-0">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-lg"><div class="d-flex flex-wrap gap-2">
          <button id="addPdf" type="button" class="btn btn-primary"><i class="bi bi-file-earmark-plus me-1"></i>Add PDF</button>
          <button id="addBlank" type="button" class="btn btn-primary"><i class="bi bi-file-earmark me-1"></i>Blank Page</button>
          <button id="exportPdf" type="button" class="btn btn-success" disabled><i class="bi bi-download me-1"></i>Export PDF</button>
          <button id="clearAll" type="button" class="btn btn-danger" disabled><i class="bi bi-trash3 me-1"></i>Clear All</button>
        </div></div>

        <div class="col-12 col-lg-auto"><div class="d-flex justify-content-lg-end"><div class="dropdown">
          <button id="columnsButton" type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-grid-3x3-gap me-1"></i>Columns: 6</button>
          <ul id="columnsMenu" class="dropdown-menu dropdown-menu-end" aria-labelledby="columnsButton"><li><button type="button" class="dropdown-item" data-columns="2">2 Columns</button></li><li><button type="button" class="dropdown-item" data-columns="3">3 Columns</button></li><li><button type="button" class="dropdown-item" data-columns="4">4 Columns</button></li><li><button type="button" class="dropdown-item" data-columns="5">5 Columns</button></li><li><button type="button" class="dropdown-item active" data-columns="6">6 Columns</button></li>
          </ul>
        </div></div></div>
      </div>
      <div class="row g-2 align-items-center mt-1">
        <div class="col-12 col-lg"><div class="d-flex flex-wrap gap-2">
          <button id="clearSelection" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-x-circle me-1"></i>Clear Selection (0)</button>
          <button id="deleteSelected" type="button" class="btn btn-outline-danger" disabled><i class="bi bi-trash me-1"></i>Delete</button>
          <button id="rotateSelected" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-clockwise me-1"></i>Rotate 90°</button>
          <button id="moveUp" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-up me-1"></i>Move Up</button>
          <button id="moveDown" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-down me-1"></i>Move Down</button>
        </div></div>

        <div class="col-12 col-lg-auto"><div class="d-flex flex-wrap justify-content-lg-end gap-2">
          <button id="undoBtn" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-counterclockwise me-1"></i>Undo</button>
        </div></div>
      </div>
    </div>
    <div id="pageListScrollArea" class="py-3 flex-grow-1 overflow-y-auto overflow-x-hidden">
    <div>
    <div id="emptyState" class="rounded p-5 text-center text-secondary border border-2 border-secondary-subtle">No pages yet. Add a PDF or create a blank page.</div>
    <div id="pages" class="row row-cols-2 row-cols-sm-3 row-cols-lg-6 g-3" aria-label="PDF pages"></div>
    </div>
    </div>
  </section>
  <section id="pageDetailsSection" class="d-none d-flex flex-column flex-grow-1 overflow-hidden">
    <div id="pageDetailsToolbar" class="bg-body border-bottom py-3 flex-shrink-0">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-lg"><div class="d-flex flex-wrap gap-2 align-items-center">
          <button id="back" type="button" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Pages</button>
        </div></div>

        <div class="col-12 col-lg-auto"><div class="d-flex flex-wrap justify-content-lg-end gap-2 align-items-center">
          <span id="pagePosition" class="small text-secondary" aria-live="polite">Page 1 / 1</span>
          <button id="previous" type="button" class="btn btn-primary" aria-label="Previous page"><i class="bi bi-chevron-left"></i></button>
          <button id="next" type="button" class="btn btn-primary" aria-label="Next page"><i class="bi bi-chevron-right"></i></button>
          <div class="dropdown">
            <button id="detailsZoomButton" type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">Zoom: 100%</button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="detailsZoomButton" style="max-height: 65vh; overflow-y: auto;">
              <li><button type="button" class="dropdown-item" data-zoom-value="200">200%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="175">175%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="150">150%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="125">125%</button></li>
              <li><button type="button" class="dropdown-item active" data-zoom-value="100">100%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="75">75%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="50">50%</button></li>
              <li><button type="button" class="dropdown-item" data-zoom-value="25">25%</button></li>
            </ul>
            <select id="detailsZoom" class="d-none" aria-label="Page zoom" tabindex="-1">
              <option value="fit">Fit</option><option value="200">200%</option><option value="175">175%</option><option value="150">150%</option><option value="125">125%</option><option value="100" selected>100%</option><option value="75">75%</option><option value="50">50%</option><option value="25">25%</option>
            </select>
          </div>
        </div></div>
      </div>
      <div id="pageDetailsDrawingTools" class="row g-2 align-items-center mt-1">
        <div class="col-12 col-lg"><div class="d-flex flex-wrap gap-2">
          <button id="toolHold" type="button" class="btn btn-primary" aria-pressed="true" title="Hold and drag to move the page"><i class="bi bi-hand-index-thumb me-1"></i>Hold</button>
          <button id="toolSelectText" type="button" class="btn btn-outline-primary" data-demo-tool="SelectText" title="Select and copy recognized PDF text"><i class="bi bi-cursor-text me-1"></i>Select Text</button>
          <button id="toolPageSize" type="button" class="btn btn-outline-primary" data-demo-tool="PageSize"><i class="bi bi-aspect-ratio me-1"></i>Page Size</button>
          <button id="toolHighlight" type="button" class="btn btn-outline-primary" data-demo-tool="Highlight"><i class="bi bi-highlighter me-1"></i>Highlight</button>
          <button id="toolAddText" type="button" class="btn btn-outline-primary" data-demo-tool="Text"><i class="bi bi-fonts me-1"></i>Text</button>
          <button id="toolImage" type="button" class="btn btn-outline-primary" data-demo-tool="Image"><i class="bi bi-image me-1"></i>Image</button>
          <button id="toolRectangle" type="button" class="btn btn-outline-primary" data-demo-tool="Rectangle"><i class="bi bi-square me-1"></i>Rectangle</button>
          <button id="toolEllipse" type="button" class="btn btn-outline-primary" data-demo-tool="Ellipse"><i class="bi bi-circle me-1"></i>Ellipse</button>
          <button id="toolDrawLine" type="button" class="btn btn-outline-primary" data-demo-tool="Line"><i class="bi bi-slash-lg me-1"></i>Line</button>
          <button id="toolDraw" type="button" class="btn btn-outline-primary" data-demo-tool="Draw"><i class="bi bi-pencil me-1"></i>Draw</button>
        </div></div>
        <div class="col-12 col-lg-auto"><div class="d-flex flex-wrap justify-content-lg-end gap-2">
          <button id="undoBtnDetails" type="button" class="btn btn-outline-secondary" disabled><i class="bi bi-arrow-counterclockwise me-1"></i>Undo</button>
        </div></div>
      </div>
      <div id="pageDetailsToolOptions" class="row g-2 align-items-center mt-1 d-none" aria-live="polite">
        <div class="col-12"><div id="pageDetailsToolOptionsContent" class="d-flex flex-wrap align-items-center gap-3"></div></div>
      </div>
    </div>
    <div id="pageDetailsScrollArea" class="flex-grow-1 overflow-auto">
    <div id="editorPage" class="bg-body-tertiary rounded my-3 p-3"><div id="detailsPaper" class="mx-auto bg-white shadow rounded overflow-hidden position-relative"><canvas id="detailsCanvas" class="d-block" aria-label="Selected PDF page"></canvas><div id="ocrTextLayer" class="position-absolute top-0 start-0 w-100 h-100 d-none" aria-label="Selectable recognized PDF text"></div><div id="highlightLayer" class="position-absolute top-0 start-0 w-100 h-100"></div><div id="textLayer" class="position-absolute top-0 start-0 w-100 h-100"></div><div id="imageLayer" class="position-absolute top-0 start-0 w-100 h-100"></div><div id="shapeLayer" class="position-absolute top-0 start-0 w-100 h-100"></div></div></div><textarea id="editorText" class="d-none" aria-hidden="true"></textarea>
    </div>
  </section>
</main>
<input id="fileInput" type="file" accept=".pdf,application/pdf" multiple hidden>
<div id="editorStatus" class="visually-hidden" role="status" aria-live="polite"></div>
<div id="clearAllModal" class="modal fade" tabindex="-1" aria-labelledby="clearAllModalLabel"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h2 id="clearAllModalLabel" class="modal-title fs-5">Clear All Pages?</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">Are you sure you want to remove all pages? This action cannot be undone. Undo history will also be deleted.</div>
  <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button id="confirmClearAll" type="button" class="btn btn-danger">Clear All</button></div>
</div></div></div>
<div id="exportScopeModal" class="modal fade" tabindex="-1" aria-labelledby="exportScopeModalLabel"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h2 id="exportScopeModalLabel" class="modal-title fs-5">Export PDF</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><p>Choose which pages to export.</p>
    <div class="form-check mb-3"><input id="exportAll" class="form-check-input" type="radio" name="exportScope" value="all" checked><label class="form-check-label" for="exportAll"><strong>All Pages</strong><br><small id="allPageCount" class="text-secondary"></small></label></div>
    <div class="form-check"><input id="exportSelected" class="form-check-input" type="radio" name="exportScope" value="selected"><label class="form-check-label" for="exportSelected"><strong>Selected Pages</strong><br><small id="selectedPageCount" class="text-secondary"></small></label></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button id="confirmExport" type="button" class="btn btn-success"><i class="bi bi-download me-1"></i>Export PDF</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(() => {
  const root = document.documentElement;
  const choices = [...document.querySelectorAll('[data-theme-choice]')];
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  const valid = ['light', 'dark', 'auto'];
  let choice = 'auto';
  try {
    const stored = localStorage.getItem('pdfEditorTheme');
    if (valid.includes(stored)) choice = stored;
  } catch (_) {}
  function applyTheme() {
    root.setAttribute('data-bs-theme', choice === 'auto' ? (media.matches ? 'dark' : 'light') : choice);
    const icon = document.querySelector('#themeButton > i');
    if (icon) icon.className = 'bi ' + (choice === 'light' ? 'bi-sun' : choice === 'dark' ? 'bi-moon-stars' : 'bi-circle-half') + ' me-1';
    choices.forEach(button => {
      const selected = button.dataset.themeChoice === choice;
      button.classList.toggle('active', selected);
      button.setAttribute('aria-pressed', String(selected));
    });
  }
  choices.forEach(button => button.addEventListener('click', () => {
    choice = button.dataset.themeChoice;
    try { localStorage.setItem('pdfEditorTheme', choice); } catch (_) {}
    applyTheme();
  }));
  if (media.addEventListener) media.addEventListener('change', applyTheme);
  else if (media.addListener) media.addListener(applyTheme);
  applyTheme();
})();
</script>

<script type="module" src="./pdf-editor/index.js"></script>
</body>
</html>
